name: Deploy Universo Maker to Azure Static Web Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy production
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare static artifact
        run: |
          mkdir dist
          cp index.html dist/
          cp -R assets dist/

      - name: Deploy static files
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_MUSHROOM_03539260F }}
          action: upload
          app_location: /dist
          skip_app_build: true
